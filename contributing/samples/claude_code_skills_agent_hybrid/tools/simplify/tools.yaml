tools:
  - read_project_file
  - backup_project_file
  - replace_text_in_project_file
  - write_project_file
  - list_changed_files
  - read_git_diff
mappings:
  - from: Read / inspect a file
    to: read_project_file
  - from: Back up a file
    to: backup_project_file
  - from: Targeted text replacement
    to: replace_text_in_project_file
  - from: Full-file overwrite
    to: write_project_file
  - from: git diff / inspect the diff
    to: read_git_diff
